<svg width="393" height="852" viewBox="0 0 393 852" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Device Frame & Canvas Background -->
  <rect width="393" height="852" rx="44" fill="#F1F5F9"/>
  <rect x="1.5" y="1.5" width="390" height="849" rx="42.5" stroke="#18181B" stroke-width="3"/>

  <!-- Map Canvas & Street Grid -->
  <g id="MapGrid">
    <path d="M 0 130 L 393 180 M 60 0 L 100 490 M 270 0 L 250 490 M 0 340 L 393 280 M 160 0 L 180 490" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round"/>
    <path d="M 0 220 L 393 250 M 310 120 L 393 380 M 20 80 L 180 20" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>

    <!-- Makassar Watermark -->
    <text x="136" y="180" font-family="Inter, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#CBD5E1" opacity="0.8">Makassar</text>
  </g>

  <!-- Status Bar (Dark on Map) -->
  <text x="32" y="32" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#18181B">9:41</text>
  <rect x="141" y="12" width="112" height="28" rx="14" fill="#18181B"/>
  <text x="312" y="31" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#18181B">5G</text>
  <rect x="338" y="21" width="22" height="12" rx="3.5" stroke="#18181B" stroke-width="1.5"/>
  <rect x="340.5" y="23.5" width="14" height="7" rx="1.5" fill="#18181B"/>
  <path d="M 361 25.5 C 361.6 25.8 362 26.4 362 27 C 362 27.6 361.6 28.2 361 28.5" stroke="#18181B" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Back Button (Top Left) -->
  <circle cx="40" cy="72" r="19" fill="#FFFFFF" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.06))"/>
  <path d="M 43 66 L 37 72 L 43 78" stroke="#18181B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Floating Route Summary Pill (Top Center) -->
  <rect x="76" y="53" width="240" height="38" rx="19" fill="#FFFFFF"/>
  <text x="196" y="77" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#18181B">28.5 KM (Full Loop) • 1 Jam 10 Mns</text>

  <!-- Closed-Loop Route Triangle (V0 -> V2 -> V1 -> V0) -->
  <g id="ClosedLoopRoute">
    <!-- Dark base line -->
    <polygon points="196,350 290,140 110,230" fill="none" stroke="#18181B" stroke-width="7" stroke-linejoin="round"/>
    <!-- Glowing Electric Lime Overlay -->
    <polygon points="196,350 290,140 110,230" fill="none" stroke="#C6FF00" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Pin V0: Depot Pettarani (Active Start/End) -->
    <circle cx="196" cy="350" r="16" fill="#18181B" stroke="#C6FF00" stroke-width="3"/>
    <text x="196" y="354" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">V0</text>
    <rect x="146" y="374" width="100" height="20" rx="10" fill="#18181B"/>
    <text x="196" y="388" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#C6FF00">Depot Pettarani</text>

    <!-- Pin V2: Antang -->
    <circle cx="290" cy="140" r="14" fill="#18181B" stroke="#C6FF00" stroke-width="2"/>
    <text x="290" y="144" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">V2</text>
    <text x="290" y="166" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#18181B">Antang</text>

    <!-- Pin V1: Sudiang -->
    <circle cx="110" cy="230" r="14" fill="#18181B" stroke="#C6FF00" stroke-width="2"/>
    <text x="110" y="234" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">V1</text>
    <text x="110" y="256" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#18181B">Sudiang</text>

    <!-- GPS Recenter Button -->
    <circle cx="340" cy="420" r="19" fill="#FFFFFF"/>
    <circle cx="340" cy="420" r="8" fill="none" stroke="#18181B" stroke-width="2"/>
    <circle cx="340" cy="420" r="3" fill="#18181B"/>
  </g>

  <!-- Dark Charcoal Bottom Sheet Overlay -->
  <g id="DarkSheet">
    <rect x="0" y="470" width="393" height="382" rx="28" fill="#18181B"/>

    <!-- Segmented Pill Tab Switcher -->
    <rect x="20" y="490" width="353" height="42" rx="21" fill="#27272A"/>
    <!-- Active Tab -->
    <rect x="24" y="494" width="170" height="34" rx="17" fill="#C6FF00"/>
    <text x="109" y="516" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#18181B">Urutan Rute Loop</text>
    <!-- Inactive Tab -->
    <text x="281" y="516" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#A1A1AA">Shipping Detail</text>

    <!-- Queue Timeline List -->
    <!-- Stop 1: Depot Pettarani -->
    <circle cx="36" cy="564" r="6" fill="#C6FF00"/>
    <text x="54" y="560" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Depot Pettarani</text>
    <text x="54" y="576" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#A1A1AA">V0, Depot Pettarani</text>

    <!-- Stop 2: V2 Antang -->
    <circle cx="36" cy="614" r="6" fill="#52525B"/>
    <text x="54" y="610" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">V2 Antang</text>
    <text x="54" y="626" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#A1A1AA">V1, Sudiang, Sieman</text>

    <!-- Primary Bottom CTA Button -->
    <g id="PrimaryCTA">
      <rect x="20" y="760" width="353" height="54" rx="27" fill="#C6FF00"/>
      <text x="196" y="793" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#18181B">Mulai Navigasi Langsung</text>
    </g>
  </g>
</svg>

