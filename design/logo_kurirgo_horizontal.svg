<svg width="540" height="140" viewBox="0 0 540 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Depth -->
    <rect id="bg" width="540" height="140" rx="24" fill="#18181B"/>

    <!-- Electric Lime Core Gradient -->
    <linearGradient id="limeGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2FF66"/>
      <stop offset="50%" stop-color="#C6FF00"/>
      <stop offset="100%" stop-color="#84CC16"/>
    </linearGradient>
  </defs>

  <!-- Container Frame (Matte Charcoal #18181B) -->
  <rect width="540" height="140" rx="24" fill="#18181B"/>
  <rect x="1" y="1" width="538" height="138" rx="23" stroke="#27272A" stroke-width="2"/>

  <!-- Left Logo Emblem Icon (96x96 centered at x=74, y=70) -->
  <g id="EmblemMini" transform="translate(26, 22)">
    <!-- Base Squircle Badge -->
    <rect width="96" height="96" rx="24" fill="#202024" stroke="#2E2E33" stroke-width="1.5"/>
    <circle cx="48" cy="48" r="30" fill="#C6FF00" opacity="0.1"/>

    <!-- Outer Navigation Arc -->
    <path d="M 26 56 C 18 42 22 28 36 24 C 50 20 66 24 74 36 C 80 46 78 60 68 70 C 60 78 44 80 32 74" 
          fill="none" stroke="#2E2E33" stroke-width="5" stroke-linecap="round"/>
    <path d="M 26 56 C 18 42 22 28 36 24 C 50 20 66 24 74 36" 
          fill="none" stroke="url(#limeGradH)" stroke-width="4" stroke-linecap="round"/>

    <!-- Waypoint Nodes -->
    <circle cx="36" cy="24" r="2.5" fill="#FFFFFF"/>
    <circle cx="74" cy="36" r="2.5" fill="#C6FF00"/>

    <!-- Isometric Cargo Box -->
    <polygon points="48,28 66,38 48,48 30,38" fill="#3F3F46"/>
    <polygon points="30,38 48,48 48,68 30,58" fill="#27272A"/>
    <polygon points="48,48 66,38 66,58 48,68" fill="#18181B"/>

    <!-- Dynamic 'K' Arrow -->
    <polygon points="38,34 43,31 43,62 38,65" fill="url(#limeGradH)"/>
    <polygon points="44,46 56,34 61,37 49,49" fill="url(#limeGradH)"/>
    <polygon points="47,48 59,61 55,64 43,51" fill="url(#limeGradH)"/>
    <polygon points="62,35 68,36 65,42 63,38" fill="#FFFFFF"/>

    <circle cx="48" cy="48" r="2" fill="#C6FF00"/>
  </g>

  <!-- Right Side: Brand Wordmark & Tagline -->
  <g id="BrandWordmark" transform="translate(142, 36)">
    <!-- Main Title: KurirGO -->
    <text x="0" y="44" font-family="Inter, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
      Kurir<tspan fill="#C6FF00" font-style="italic">GO</tspan>
    </text>

    <!-- Subtitle Category Tagline -->
    <text x="2" y="66" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#A1A1AA" letter-spacing="2">
      BROWCYL DELIVERY • MAKASSAR
    </text>

    <!-- Bottom Functional Pill Badge -->
    <g transform="translate(2, 74)">
      <rect width="210" height="18" rx="9" fill="#27272A"/>
      <circle cx="10" cy="9" r="3" fill="#C6FF00"/>
      <text x="18" y="12.5" font-family="Inter, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#E4E4E7">
        SISTEM RUTE TERTUTUP (TSP)
      </text>
    </g>
  </g>
</svg>
