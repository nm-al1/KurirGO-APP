      <path d="M 16 12 V 16 L 19 18" stroke="#047857" stroke-width="1.5" stroke-linecap="round"/>
      <text x="42" y="14" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#18181B">Shift Siang (10:00 - 18:00 WITA)</text>
      <text x="42" y="27" font-family="Inter, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#047857">Tas Thermal #THM-08 • Status On-Duty</text>
    </g>
  </g>

  <!-- Section: SOP Pengantaran (Clean Rounded Emerald Checkmarks) -->
  <g id="SopComplianceCard" transform="translate(20, 440)">
    <rect width="353" height="154" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <text x="18" y="28" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="800" fill="#18181B">KEPATUHAN SOP BROWCYL MAKASSAR</text>

    <!-- SOP Item 1 -->
    <g transform="translate(18, 44)">
      <circle cx="10" cy="10" r="10" fill="#ECFDF5"/>
      <path d="M 6 10 L 9 13 L 14 7" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="14" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#18181B">Muat LIFO Bagasi Motor</text>
      <text x="28" y="27" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#64748B">Stop pertama dimuat di posisi paling atas bagasi.</text>
    </g>

    <!-- SOP Item 2 -->
    <g transform="translate(18, 80)">
      <circle cx="10" cy="10" r="10" fill="#ECFDF5"/>
      <path d="M 6 10 L 9 13 L 14 7" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="14" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#18181B">Suhu Kemasan &amp; Segel Utuh</text>
      <text x="28" y="27" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#64748B">Suhu bagasi stabil 24°C, lakban segel kue tidak koyak.</text>
    </g>

    <!-- SOP Item 3 -->
    <g transform="translate(18, 116)">
      <circle cx="10" cy="10" r="10" fill="#ECFDF5"/>
      <path d="M 6 10 L 9 13 L 14 7" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="14" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#18181B">Setor Kasir Tunai COD Selesai Rute</text>
      <text x="28" y="27" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#64748B">Uang fisik diserahkan tepat waktu di Hub Pettarani.</text>
    </g>
  </g>

  <!-- Secondary Actions: Hubungi Hub & Keluar -->
