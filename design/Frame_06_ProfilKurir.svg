      <circle cx="16" cy="14" r="2.5" fill="#18181B"/>
      <text x="42" y="14" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#18181B">Makassar Timur &amp; Sudiang</text>
