<svg width="393" height="852" viewBox="0 0 393 852" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Device Frame & Canvas Background -->
  <rect width="393" height="852" rx="44" fill="#F8FAFC"/>
  <rect x="1.5" y="1.5" width="390" height="849" rx="42.5" stroke="#18181B" stroke-width="3"/>

  <!-- Status Bar -->
  <text x="32" y="32" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#18181B">09:41</text>
  <!-- Dynamic Island -->
  <rect x="141" y="12" width="112" height="28" rx="14" fill="#18181B"/>
  <!-- Status Icons (5G, GPS Lock, Battery) -->
  <circle cx="294" cy="26" r="3" fill="#10B981"/>
  <text x="302" y="30" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#10B981">GPS</text>
  <text x="326" y="30" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#18181B">5G</text>
  <rect x="348" y="21" width="22" height="12" rx="3.5" stroke="#18181B" stroke-width="1.5"/>
  <rect x="350.5" y="23.5" width="13" height="7" rx="1.5" fill="#18181B"/>
  <path d="M 371 25.5 C 371.6 25.8 372 26.4 372 27 C 372 27.6 371.6 28.2 371 28.5" stroke="#18181B" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Top Navigation Header -->
  <g id="TopHeader">
    <!-- Back Button Circle Pill -->
    <circle cx="40" cy="74" r="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <path d="M 43 68 L 37 74 L 43 80" stroke="#18181B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Screen Title -->
    <text x="70" y="80" font-family="Inter, -apple-system, sans-serif" font-size="18.5" font-weight="900" fill="#18181B">Profil Mitra Kurir</text>

    <!-- KurirGO Brand Badge (Official Clean Pill) -->
    <g id="BrandBadge" transform="translate(262, 57)">
      <rect width="111" height="34" rx="17" fill="#18181B" stroke="#27272A" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="4.5" fill="#C6FF00"/>
      <text x="32" y="22" font-family="Inter, -apple-system, sans-serif" font-size="13.5" font-weight="900" fill="#FFFFFF" letter-spacing="-0.3">Kurir<tspan fill="#C6FF00" font-style="italic">GO</tspan></text>
    </g>
  </g>

  <!-- Courier Hero Identity Card (Matte Charcoal) -->
  <g id="CourierHeroCard">
    <rect x="20" y="104" width="353" height="174" rx="22" fill="#18181B"/>

    <!-- Avatar with Professional Courier Cap & Polo Shirt -->
    <g transform="translate(36, 122)">
      <!-- Outer Accent Ring -->
      <circle cx="30" cy="30" r="30" fill="#242428" stroke="#C6FF00" stroke-width="2.5"/>
      <!-- Shirt / Collar -->
      <path d="M 10 52 C 10 40 20 36 30 36 C 40 36 50 40 50 52 Z" fill="#333338"/>
      <polygon points="26,36 34,36 31,44 29,44" fill="#C6FF00"/>
      <!-- Head -->
      <circle cx="30" cy="24" r="11" fill="#E2A970"/>
      <!-- Browcyl Green Cap -->
      <path d="M 18 20 C 18 12 23 11 30 11 C 37 11 42 12 42 20 Z" fill="#C6FF00"/>
      <path d="M 23 20 L 42 20" stroke="#18181B" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Online Green Status Badge -->
      <circle cx="50" cy="50" r="6" fill="#10B981" stroke="#18181B" stroke-width="2"/>
    </g>

    <!-- Name & ID Badge -->
    <text x="112" y="142" font-family="Inter, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">Ardiansyah Pratama</text>
    <text x="112" y="159" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#C6FF00">ID: BRW-KRR-042</text>
    <text x="112" y="176" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#A1A1AA">Cabang Pettarani • Pusat Pengantaran</text>

    <!-- Edit Profile Action Button -->
    <g id="BtnUbahProfil" transform="translate(285, 120)">
      <rect width="72" height="28" rx="14" fill="#27272A" stroke="#3F3F46" stroke-width="1.2"/>
      <path d="M 12 18 L 15 18 L 22 11 L 19 8 L 12 15 Z M 21 7 L 23 9" stroke="#C6FF00" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="29" y="18" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Ubah</text>
    </g>

    <!-- Mini Metric Pills Row -->
    <rect x="36" y="198" width="321" height="64" rx="14" fill="#232326"/>

    <!-- Metric 1: Rating -->
    <g transform="translate(54, 210)">
      <text x="0" y="14" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#A1A1AA">Rating Kurir</text>
      <text x="0" y="38" font-family="Inter, -apple-system, sans-serif" font-size="17" font-weight="900" fill="#C6FF00">4.95 ★</text>
    </g>

    <line x1="152" y1="212" x2="152" y2="250" stroke="#3F3F46" stroke-width="1.2"/>

    <!-- Metric 2: Deliveries -->
    <g transform="translate(168, 210)">
      <text x="0" y="14" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#A1A1AA">Total Antar</text>
      <text x="0" y="38" font-family="Inter, -apple-system, sans-serif" font-size="17" font-weight="900" fill="#FFFFFF">1.240 Boks</text>
    </g>

    <line x1="264" y1="212" x2="264" y2="250" stroke="#3F3F46" stroke-width="1.2"/>

    <!-- Metric 3: Masa Kerja -->
    <g transform="translate(280, 210)">
      <text x="0" y="14" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#A1A1AA">Pengalaman</text>
      <text x="0" y="38" font-family="Inter, -apple-system, sans-serif" font-size="17" font-weight="900" fill="#C6FF00">5 Tahun</text>
    </g>
  </g>

  <!-- Section: Wilayah Operasional & Shift Dinas -->
  <g id="OperationalCoverageCard" transform="translate(20, 292)">
    <rect width="353" height="136" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <text x="18" y="28" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="800" fill="#18181B">WILAYAH OPERASIONAL &amp; SHIFT</text>

    <!-- Row 1: Wilayah Pengantaran Utama -->
    <g transform="translate(18, 42)">
      <rect width="32" height="32" rx="10" fill="#F1F5F9"/>
      <!-- Map Pin Icon -->
