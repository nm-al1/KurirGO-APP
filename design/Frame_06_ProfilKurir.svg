    <line x1="18" y1="86" x2="335" y2="86" stroke="#F1F5F9" stroke-width="1.5"/>

    <!-- Row 2: Shift Kerja & Tas Logistik -->
    <g transform="translate(18, 96)">
      <rect width="32" height="32" rx="10" fill="#ECFDF5"/>
      <!-- Clock Icon -->
