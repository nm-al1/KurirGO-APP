    <g transform="translate(32, 14)">
      <path d="M 2 4 C 2 2.9 2.9 2 4 2 L 6.5 2 C 7.2 2 7.7 2.4 7.9 3 L 8.8 5.6 C 9 6.2 8.8 6.9 8.3 7.3 L 7 8.3 C 7.9 10.3 9.7 12.1 11.7 13 L 12.7 11.7 C 13.1 11.2 13.8 11 14.4 11.2 L 17 12.1 C 17.6 12.3 18 12.8 18 13.5 L 18 16 C 18 17.1 17.1 18 16 18 C 8.3 18 2 11.7 2 4 Z" fill="#18181B"/>
    </g>
    <text x="58" y="28" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#18181B">Hubungi Hub</text>

    <!-- Logout Button -->
    <g transform="translate(183, 0)">
      <rect width="170" height="46" rx="14" fill="#FEF2F2" stroke="#FEE2E2" stroke-width="1.2"/>
      <g transform="translate(36, 14)">
        <path d="M 9 3 H 4 C 2.9 3 2 3.9 2 5 V 15 C 2 16.1 2.9 17 4 17 H 9" stroke="#EF4444" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M 12 14 L 16 10 L 12 6 M 16 10 H 6" stroke="#EF4444" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="62" y="28" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#EF4444">Keluar Akun</text>
    </g>
  </g>

  <!-- Floating Ergonomic Navigation Dock (Tab 4: Profil ACTIVE) -->
  <g id="FloatingNavDock">
    <rect x="71" y="694" width="250" height="50" rx="25" fill="#18181B"/>

    <!-- Tab 1: Vector Home Icon (Inactive) -->
    <g transform="translate(90, 712)">
      <path d="M 2 7 L 7 2 L 12 7 V 13 H 9 V 9 H 5 V 13 H 2 Z" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Tab 2: Vector Map Icon (Inactive) -->
    <g transform="translate(136, 712)">
      <path d="M 1 3 L 5 1 L 10 3 L 14 1 V 12 L 10 14 L 5 12 L 1 14 Z M 5 1 V 12 M 10 3 V 14" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Tab 3: Vector Analytics Icon (Inactive) -->
    <g transform="translate(184, 712)">
      <rect x="1" y="7" width="2.8" height="7" rx="1" fill="#FFFFFF"/>
      <rect x="5.5" y="3" width="2.8" height="11" rx="1" fill="#FFFFFF"/>
      <rect x="10" y="0" width="2.8" height="14" rx="1" fill="#FFFFFF"/>
    </g>

    <!-- Tab 4: Active Profile Capsule -->
    <rect x="228" y="700" width="86" height="38" rx="19" fill="#C6FF00"/>
    <!-- Vector User Icon (Active in Capsule) -->
    <g transform="translate(240, 712)">
      <circle cx="7" cy="4" r="3.5" fill="#18181B"/>
      <path d="M 1 14 C 1 10.5 3.5 9 7 9 C 10.5 9 13 10.5 13 14" fill="#18181B"/>
    </g>
    <text x="262" y="724" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#18181B">Profil</text>
  </g>

  <!-- Bottom Home Indicator Pill -->
  <rect x="126" y="834" width="140" height="5" rx="2.5" fill="#18181B"/>
</svg>
