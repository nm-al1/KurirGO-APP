<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Depth Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#09090B"/>
    </radialGradient>

    <!-- Electric Lime Core Gradient -->
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2FF66"/>
      <stop offset="50%" stop-color="#C6FF00"/>
      <stop offset="100%" stop-color="#84CC16"/>
    </linearGradient>

    <!-- Speed Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A3E635"/>
      <stop offset="100%" stop-color="#C6FF00"/>
    </linearGradient>

    <!-- Subtle Ambient Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- iOS / Android Squircle Base Frame -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="508" height="508" rx="114" stroke="#3F3F46" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Ambient Underglow Ring -->
  <circle cx="256" cy="256" r="140" fill="#C6FF00" opacity="0.12" filter="url(#neonGlow)"/>

  <!-- Geometric KurirGO Emblem: Closed-Loop Trajectory + Isometric Speed 'K' -->
  <g id="Emblem" transform="translate(0, 0)">
    
    <!-- Outer Closed-Loop Navigation Orbit (Representing TSP Round-Trip) -->
    <path d="M 148 296 C 110 240 128 160 192 136 C 248 116 320 134 356 184 C 386 226 376 294 332 344 C 294 388 220 398 168 368" 
          fill="none" stroke="#27272A" stroke-width="18" stroke-linecap="round"/>
    <!-- Glowing Electric Lime Arc of the Loop -->
    <path d="M 148 296 C 110 240 128 160 192 136 C 248 116 320 134 356 184" 
          fill="none" stroke="url(#limeGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- Orbital Waypoint Dots -->
    <circle cx="192" cy="136" r="8" fill="#FFFFFF"/>
    <circle cx="356" cy="184" r="8" fill="#C6FF00"/>
    <circle cx="168" cy="368" r="7" fill="#A1A1AA"/>

    <!-- Core Isometric Cargo Box (Browcyl Cake Box Foundation) -->
    <!-- Top Diamond Facet -->
    <polygon points="256,156 346,208 256,260 166,208" fill="#3F3F46"/>
    <!-- Left Shaded Facet -->
    <polygon points="166,208 256,260 256,364 166,312" fill="#27272A"/>
    <!-- Right Dark Facet -->
    <polygon points="256,260 346,208 346,312 256,364" fill="#18181B"/>

    <!-- Dynamic High-Velocity 'K' Arrow (Cut-Through in Electric Lime) -->
    <!-- Vertical Spine of 'K' (Forward Lean 12°) -->
    <polygon points="204,188 226,176 226,334 204,346" fill="url(#limeGrad)"/>
    
    <!-- Upper Diagonal Arm of 'K' (Pointing Up-Right into Arrow) -->
    <polygon points="234,250 298,186 320,198 256,262" fill="url(#limeGrad)"/>
    
    <!-- Lower Diagonal Arm of 'K' (Forward Propulsion Arrowhead) -->
    <polygon points="248,256 312,328 292,340 228,268" fill="url(#arrowGrad)"/>

    <!-- Dynamic Speed Chevron Arrowhead at Peak -->
    <polygon points="328,190 354,196 342,220 334,204" fill="#FFFFFF"/>

    <!-- Browcyl Brand Identity Tag: Emerald Delivery Radar Dot -->
    <circle cx="256" cy="260" r="10" fill="#09090B"/>
    <circle cx="256" cy="260" r="6" fill="#C6FF00"/>
  </g>
</svg>
